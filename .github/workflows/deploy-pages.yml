name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Build de Produção com Base Href
        run: npm run build -- --configuration production --base-href /WB-Models/

      - name: Garantir Suporte a SPA (Copiar index.html para 404.html)
        run: |
          DIST_PATH=$(find dist -type d -name "browser" | head -n 1)
          if [ -z "$DIST_PATH" ]; then
            DIST_PATH=$(find dist -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi
          echo "Caminho do Build: $DIST_PATH"
          cp "$DIST_PATH/index.html" "$DIST_PATH/404.html"
          echo "DIST_DIR=$DIST_PATH" >> $GITHUB_ENV

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/${{ env.DIST_DIR }}

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
