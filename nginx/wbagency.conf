# ==============================================================================
# CONFIGURAÇÃO DE PRODUÇÃO NGINX - WB AGENCY (wbagency.com.br)
# ==============================================================================

# 1. Redirecionamento HTTP -> HTTPS e www -> non-www
server {
    listen 80;
    listen [::]:80;
    server_name wbagency.com.br www.wbagency.com.br;

    # Validação do Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://wbagency.com.br$request_uri;
    }
}

# 2. Servidor Principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wbagency.com.br;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/wbagency.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wbagency.com.br/privkey.pem;

    return 301 https://wbagency.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wbagency.com.br;

    # Raiz dos arquivos estáticos compilados do Angular (npm run build:prod)
    root /var/www/wbagency/dist/frontend/browser;
    index index.html;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/wbagency.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wbagency.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Protocolos e Cifras Criptográficas Modernas (TLS 1.2 e 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Cabeçalhos de Segurança Defensiva
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Limite de Upload para Envio de Fotos/Composites (Até 25MB)
    client_max_body_size 25M;

    # Proxy Reverso para a API Spring Boot (/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Cache imutável para assets estáticos com hash
    location ~* \.(?:js|css|woff2|woff|ttf|svg|png|jpg|jpeg|webp|ico|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Desativa cache para o index.html (garante deploy contínuo imediato)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Roteamento SPA Angular (Fallback para index.html em /admin, /sobre, /contact, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
