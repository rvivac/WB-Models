@if (isOpen()) {
  <div class="modal-backdrop" (click)="onClose()">
    <div class="modal-dialog card-editorial" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title font-serif">{{ title() }}</h3>
        <button class="modal-close-btn" (click)="onClose()" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
