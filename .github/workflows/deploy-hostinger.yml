# WB Agency - Pipeline de Deploy Hostinger (Angular 18 -> public_html via FTP)
# Deploy trigger: 2026-10-03T12:06:00
name: Deploy Frontend para Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Angular & Deploy FTP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Angular em Produção
        run: npm run build -- --configuration production

      - name: Garantir fallback SPA para rotas (404.html e .htaccess)
        run: |
          DIST_DIR="dist/frontend/browser"
          if [ -d "$DIST_DIR" ]; then
            cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
            # Cria .htaccess para Apache/Hostinger rotear o Angular SPA
            cat << 'EOF' > "$DIST_DIR/.htaccess"
DirectoryIndex index.html index.php
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /
  RewriteRule ^index\.html$ - [L]
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule . /index.html [L]
</IfModule>
EOF
          fi

      - name: Validar e Garantir Presença dos Assets no Pacote de Deploy
        run: |
          DIST_DIR="dist/frontend/browser"
          echo "=== Verificando integridade dos assets para deploy na Hostinger ==="
          if [ ! -d "$DIST_DIR/assets" ]; then
            echo "ERRO CRÍTICO: Pasta assets não encontrada em $DIST_DIR!"
            exit 1
          fi
          echo "Lista de arquivos e subdiretórios em assets:"
          ls -la "$DIST_DIR/assets"
          ls -la "$DIST_DIR/assets/i18n"
          ls -la "$DIST_DIR/assets/images"
          ls -la "$DIST_DIR/assets/videos"
          echo "Assets validados com sucesso para o deploy."

      - name: Enviar arquivos via FTP para a Hostinger (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 300000
          local-dir: ./frontend/dist/frontend/browser/
          server-dir: ./public_html/

