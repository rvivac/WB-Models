server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  application:
    name: wb-scouting-api

  datasource:
    # URL do Supabase Connection Pooler (porta 6543 em Transaction Mode ou 5432)
    # Formato: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WbScoutingHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      # Preparação para Transaction Pooler do Supabase (PgBouncer)
      connection-test-query: SELECT 1
      auto-commit: true

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Validação estrita do schema gerado pelo DDL do Supabase
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@wbscouting.com}
    password: ${MAIL_PASSWORD:dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Configurações da Aplicação
app:
  mail:
    from-address: ${MAIL_FROM:no-reply@wbagency.com}
    from-name: "WB Agency"
    agency-notification-email: ${AGENCY_CONTACT_EMAIL:contato@wbagency.com}
    reset-password-base-url: ${RESET_PWD_URL:http://localhost:4200/admin/reset-password}
  security:
    jwt:
      # Secret key com no mínimo 256 bits (HMAC-SHA256)
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000 # 24 horas em milissegundos
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://wbscouting.com}

# Configurações do Supabase Storage e API
supabase:
  url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:dummy-key}
  anon-key: ${SUPABASE_ANON_KEY:dummy-key}
  buckets:
    site-assets: site-assets
    models-media: models-media
    candidates-uploads: candidates-uploads

logging:
  level:
    root: INFO
    com.wbscouting.api: DEBUG
    org.springframework.security: INFO
