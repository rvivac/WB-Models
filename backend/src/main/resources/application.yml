server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  config:
    import:
      - optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  application:
    name: wb-scouting-api

  datasource:
    # Pooler via porta 6543 com flags explícitas para evitar retenção de buffers TLS
    url: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.stmytwsdlonpnirqiufq
    password: U7MevYDCOEjBOBS3
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WbScoutingHikariPool
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
      auto-commit: true

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@wbscouting.com}
    password: ${MAIL_PASSWORD:dummy-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Configurações da Aplicação
app:
  mail:
    from-address: ${MAIL_FROM:no-reply@wbscouting.com}
    from-name: "WB Scouting"
    agency-notification-email: ${AGENCY_CONTACT_EMAIL:contato@wbscouting.com}
    reset-password-base-url: ${RESET_PWD_URL:http://localhost:4200/admin/reset-password}
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas
    initial-admin:
      email: ${INITIAL_ADMIN_EMAIL:admin@wbscouting.com}
      password: ${INITIAL_ADMIN_PASSWORD:Admin@WbScouting2026!}
      name: ${INITIAL_ADMIN_NAME:Administrador WB Scouting}
  cors:
    # Adicionado http://localhost:4200 para permitir requisições do frontend Angular
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://wbscouting.com}

# Configurações do Supabase Storage e API
ssupabase:
  url: ${SUPABASE_URL:https://stmytwsdlonpnirqiufq.supabase.co}
  key: ${SUPABASE_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  anon-key: ${SUPABASE_ANON_KEY}
  storage:
    local-fallback: false
    local-dir: uploads
    local-base-url: http://localhost:8080
  buckets:
    site-assets: site-assets
    models-media: models-media
    candidates-uploads: candidates-uploads

logging:
  level:
    root: INFO
    com.wbscouting.api: DEBUG
    org.springframework.security: INFO