# WB Agency - Pipeline de Deploy Hostinger (Angular 18 build -> public_html)
# Suporta DUAS vias simultâneas:
# 1. FTP Automático (LFTP espelha exclusivamente dist/frontend/browser -> public_html)
# 2. Branch hostinger-deploy (commit automático apenas do build para uso no Git do hPanel)
name: Deploy Frontend para Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Angular & Deploy Hostinger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Angular em Produção
        run: npm run build:prod

      - name: Garantir fallback SPA (404.html e .htaccess)
        run: |
          DIST_DIR="dist/frontend/browser"
          if [ ! -d "$DIST_DIR" ]; then
            echo "ERRO CRÍTICO: Build Angular NÃO GEROU $DIST_DIR!"
            exit 1
          fi
          # Fallback para rotas SPA caso servidor busque 404.html
          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"

          # Garante que o .htaccess completo de public/ esteja presente no diretório de build
          if [ ! -f "$DIST_DIR/.htaccess" ] && [ -f "public/.htaccess" ]; then
            cp "public/.htaccess" "$DIST_DIR/.htaccess"
          fi

          echo "--- Verificando .htaccess no pacote de build ---"
          ls -la "$DIST_DIR/.htaccess" && cat "$DIST_DIR/.htaccess"

      - name: Validar Integridade dos Arquivos de Build
        run: |
          DIST_DIR="dist/frontend/browser"
          echo "=== Verificando arquivos resultantes do build em $DIST_DIR ==="
          ls -la "$DIST_DIR"
          if [ ! -d "$DIST_DIR/assets" ]; then
            echo "ERRO CRÍTICO: Pasta assets não encontrada em $DIST_DIR!"
            exit 1
          fi
          if [ ! -f "$DIST_DIR/index.html" ]; then
            echo "ERRO CRÍTICO: index.html não encontrado em $DIST_DIR!"
            exit 1
          fi
          echo "Tamanhos de arquivos críticos do build:"
          du -cb "$DIST_DIR/assets/videos/"* 2>/dev/null | tail -1 || true
          du -b "$DIST_DIR/assets/images/hero-poster.jpg" 2>/dev/null || true
          echo "Arquivos de build validados com sucesso para o deploy."

      # =========================================================================
      # VIA 1: DEPLOY DIRETO VIA FTP PARA public_html NA HOSTINGER
      # Espelha EXCLUSIVAMENTE dist/frontend/browser para public_html/
      # =========================================================================
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          TARGET_DIR: ${{ secrets.FTP_SERVER_DIR != '' && secrets.FTP_SERVER_DIR || 'domains/wbagency.com.br/public_html/' }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/frontend/browser/
          server-dir: ${{ env.TARGET_DIR }}
        continue-on-error: true

      # =========================================================================
      # VIA 2: PUBLICAR ARQUIVOS DE BUILD NA BRANCH hostinger-deploy
      # Cria/atualiza automaticamente a branch 'hostinger-deploy' contendo APENAS
      # os arquivos compilados (index.html, assets, .htaccess) na raiz.
      # Se a Hostinger estiver configurada com Git Deployment (hPanel -> Git),
      # ela deve puxar desta branch para ter o site 100% funcional sem código-fonte.
      # =========================================================================
      - name: Publicar arquivos de build na branch hostinger-deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist/frontend/browser
          branch: hostinger-deploy
          clean: true
          commit-message: 'deploy: arquivos compilados de producao (Hostinger) [skip ci]'
