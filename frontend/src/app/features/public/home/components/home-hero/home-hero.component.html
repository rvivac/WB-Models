<section class="hero-section relative h-screen w-full overflow-hidden flex items-center justify-center">
  <!-- Vídeo Background em Loop com Fallback Gracioso -->
  @if (!isVideoError()) {
    <video
      #heroVideo
      autoplay
      loop
      muted
      playsinline
      preload="metadata"
      class="hero-video absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
      [poster]="heroData().posterImageUrl || '/assets/images/hero-poster.jpg'"
      (loadeddata)="onVideoLoaded()"
      (error)="onVideoError()"
    >
      <source [src]="heroData().videoUrl || '/assets/videos/wb-presentation.mp4'" type="video/mp4">
      Seu navegador não suporta reprodução de vídeos em HTML5.
    </video>
  }

  <!-- Fallback com Poster Editorial caso o vídeo falhe -->
  @if (isVideoError()) {
    <div 
      class="hero-poster-fallback ken-burns absolute inset-0 w-full h-full bg-cover bg-center z-0"
      [style.background-image]="'url(' + (heroData().posterImageUrl || '/assets/images/hero-poster.jpg') + ')'">
    </div>
  }

  <!-- Overlay Editorial com transição suave para o fundo claro (#FBFBF9) -->
  <div class="hero-overlay absolute inset-0 z-10"></div>

  <!-- Conteúdo em Primeiro Plano -->
  <div class="hero-content relative z-20 text-center px-4 max-w-5xl mx-auto flex flex-col items-center hero-content-inner">
    <h1 class="hero-headline font-serif text-3xl md:text-5xl lg:text-6xl text-white tracking-wider mb-4 uppercase">
      {{ heroData().title || 'High Fashion & Scouting' }}
    </h1>

    <p class="hero-manifesto text-neutral-300 font-sans tracking-[0.3em] uppercase text-xs md:text-sm mb-8">
      {{ heroData().subtitle || 'Gestão de Carreiras • Scouting Internacional' }}
    </p>

    <div class="hero-buttons flex gap-4">
      <a [routerLink]="heroData().ctaLink || '/modelos'" class="btn-primary">
        {{ heroData().ctaText || 'Ver Elenco' }}
      </a>
      <a routerLink="/seja-modelo" class="btn-secondary">
        Seja Modelo
      </a>
    </div>
  </div>

  <!-- Indicador de Rolagem Elegante -->
  <button 
    type="button" 
    class="scroll-down-btn" 
    (click)="scrollToContent()" 
    aria-label="Rolar para os destaques">
    <span class="mouse-icon">
      <span class="mouse-wheel"></span>
    </span>
    <span class="scroll-text tracking-editorial">SCROLL</span>
  </button>
</section>
