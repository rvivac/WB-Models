@if (siteAccessService.isGateActive()) {
  <app-site-access-gate></app-site-access-gate>
}

@if (!isAdminRoute()) {
  <app-header></app-header>
} @else if (showAdminHeader()) {
  <app-admin-header></app-admin-header>
}

<main class="app-main-content" [class.admin-mode]="isAdminRoute()">
  <router-outlet></router-outlet>
</main>

@if (!isAdminRoute()) {
  <app-footer></app-footer>
}
