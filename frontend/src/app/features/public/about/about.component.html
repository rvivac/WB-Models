<!-- Página Sobre Nós (Editorial, Dinâmica e Conectada ao Backend) -->
<article class="about-page bg-[#FFFFFF] min-h-screen text-[#222624]">
  <!-- Topo Editorial e Breadcrumbs -->
  <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 pt-28 pb-4">
    <nav class="header-breadcrumbs flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.15em] text-[#5F6661]">
      <a routerLink="/" class="breadcrumb-link text-[#5F6661] hover:text-[#4B584E] transition-colors">
        {{ 'nav.home' | translate }}
      </a>
      <span class="breadcrumb-separator text-[#D0D4D0]">/</span>
      <span class="breadcrumb-current text-[#4B584E]">
        {{ 'nav.about' | translate }}
      </span>
    </nav>
  </div>

  <section class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 py-12 space-y-10">
    <!-- TÍTULO PRINCIPAL (HEADLINE) & CITAÇÃO (QUOTE) -->
    <div *ngIf="content?.headline?.trim() || content?.quote?.trim()" class="border-b border-[#E8EBE8] pb-6">
      <!-- Título Principal / Headline -->
      <h1 *ngIf="content?.headline?.trim()" class="page-title text-3xl md:text-5xl font-light tracking-tight text-[#222624]">
        {{ content?.headline }}
      </h1>

      <!-- Frase de Impacto / Quote -->
      <blockquote *ngIf="content?.quote?.trim()" class="hero-quote-box">
        <p class="mt-4 text-base md:text-lg text-[#5F6661] font-serif italic max-w-4xl leading-relaxed">
          “{{ content?.quote }}”
        </p>
      </blockquote>
    </div>

    <!-- BLOCO EDITORIAL (SEÇÃO DE FILOSOFIA / MANIFESTO) -->
    <div *ngIf="content?.body?.trim() || content?.sectionTitle?.trim()" class="manifesto-section space-y-4 max-w-4xl">
      <!-- Título da Seção (Section Title) -->
      <h2 *ngIf="content?.sectionTitle?.trim()" class="text-xs font-serif uppercase tracking-[0.25em] text-[#4B584E] font-semibold">
        {{ content?.sectionTitle }}
      </h2>

      <!-- Corpo Editorial (Body) -->
      <p *ngIf="content?.body?.trim()" class="text-sm md:text-base text-[#222624] leading-relaxed whitespace-pre-line font-sans">
        {{ content?.body }}
      </p>
    </div>
  </section>
</article>
