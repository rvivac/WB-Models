<div class="contact-page">
  <div class="container">
    <!-- Cabeçalho Editorial Padronizado -->
    <header class="page-header contact-header">
      <nav class="header-breadcrumbs">
        <a routerLink="/" class="breadcrumb-link">{{ 'nav.home' | translate }}</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">{{ 'nav.contact' | translate }}</span>
      </nav>
      <h1 class="page-title font-serif contact-title">{{ 'contact_page.title' | translate }}</h1>
    </header>
    <!-- Quadro Unificado de Contatos (Canais Diretos) -->
    <section class="contacts-single-section" [attr.aria-label]="'contact_page.channels_aria' | translate">
      <article class="channel-card card-editorial highlighted card-contacts-unified" id="card-bookers">
        <div class="card-content">
          <!-- Ações Protegidas de Contato: WhatsApp, Telefone, E-mail e Instagram -->
          <div class="protected-actions-list contacts-grid-actions">
            <!-- 1. Botão Seguro WhatsApp -->
            <button 
              type="button" 
              (click)="onWhatsAppClick()" 
              class="btn-protected btn-whatsapp" 
              id="btn-secure-whatsapp"
              [attr.aria-label]="'contact_page.card_contacts.whatsapp_aria' | translate">
              <div class="btn-protected-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.694.062-1.121-.077-.282-.092-.647-.215-1.116-.421-1.996-.879-3.298-2.906-3.398-3.041-.099-.136-.811-1.081-.811-2.062 0-.981.513-1.464.697-1.664.183-.2.401-.25.535-.25.134 0 .268.001.385.007.123.006.288-.047.45.343.167.405.571 1.393.621 1.495.05.101.084.221.017.354-.067.133-.101.216-.201.332-.1.117-.21.261-.3.35-.1.101-.205.211-.088.411.117.2 1.521 2.476 1.705 2.678.183.201.288.167.421.034.133-.134.571-.667.724-.897.152-.23.305-.192.513-.115.209.077 1.328.626 1.558.741.23.115.385.172.441.269.057.098.057.568-.087.973z"/>
                  <path d="M12.004 2c-5.523 0-10 4.477-10 10 0 1.83.498 3.546 1.364 5.023l-1.368 5.001 5.127-1.344c1.436.817 3.099 1.284 4.877 1.284 5.523 0 10-4.477 10-10s-4.477-10-10-10zm0 18.062c-1.574 0-3.05-.448-4.309-1.222l-.309-.191-3.042.798.812-2.966-.208-.332c-.852-1.356-1.31-2.936-1.31-4.579 0-4.636 3.771-8.406 8.406-8.406 4.636 0 8.406 3.77 8.406 8.406 0 4.635-3.77 8.405-8.406 8.405z"/>
                </svg>
              </div>
              <div class="btn-protected-text">
                <span class="btn-action-label">{{ 'contact_page.card_contacts.whatsapp_label' | translate }}</span>
                <span class="btn-action-val">{{ secureContact.phoneDisplay }}</span>
              </div>
              <span class="btn-click-hint">{{ 'contact_page.card_contacts.whatsapp_action' | translate }}</span>
            </button>

            <!-- 2. Botão Seguro Telefone -->
            <button 
              type="button" 
              (click)="onPhoneClick()" 
              class="btn-protected btn-phone" 
              id="btn-secure-phone"
              [attr.aria-label]="'contact_page.card_contacts.phone_aria' | translate">
              <div class="btn-protected-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
              </div>
              <div class="btn-protected-text">
                <span class="btn-action-label">{{ 'contact_page.card_contacts.phone_label' | translate }}</span>
                <span class="btn-action-val">{{ secureContact.phoneDisplay }}</span>
              </div>
              <span class="btn-click-hint">{{ 'contact_page.card_contacts.phone_action' | translate }}</span>
            </button>

            <!-- 3. Botão Seguro E-mail -->
            <button 
              type="button" 
              (click)="onMailClick()" 
              class="btn-protected btn-email" 
              id="btn-secure-email"
              [attr.aria-label]="'contact_page.card_contacts.email_aria' | translate">
              <div class="btn-protected-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
              <div class="btn-protected-text">
                <span class="btn-action-label">{{ 'contact_page.card_contacts.email_label' | translate }}</span>
                <span class="btn-action-val">{{ secureContact.emailDisplay }}</span>
              </div>
              <span class="btn-click-hint">{{ 'contact_page.card_contacts.email_action' | translate }}</span>
            </button>

            <!-- 4. Botão Seguro Instagram -->
            <button 
              type="button" 
              (click)="onInstagramClick()" 
              class="btn-protected btn-instagram" 
              id="btn-secure-instagram"
              [attr.aria-label]="'contact_page.card_contacts.instagram_aria' | translate">
              <div class="btn-protected-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
              </div>
              <div class="btn-protected-text">
                <span class="btn-action-label">{{ 'contact_page.card_contacts.instagram_label' | translate }}</span>
                <span class="btn-action-val">{{ secureContact.instagramDisplay }}</span>
              </div>
              <span class="btn-click-hint">{{ 'contact_page.card_contacts.instagram_action' | translate }}</span>
            </button>

            <!-- Redes Sociais Oficiais Dinâmicas -->
            @for (social of secureContact.socialMediaList; track social.name) {
              <a 
                [href]="social.url" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="btn-protected btn-social" 
                [attr.aria-label]="social.name">
                <div class="btn-protected-icon">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                  </svg>
                </div>
                <div class="btn-protected-text">
                  <span class="btn-action-label">{{ social.name }}</span>
                  <span class="btn-action-val">{{ social.url }}</span>
                </div>
                <span class="btn-click-hint">Acessar</span>
              </a>
            }
          </div>
        </div>
      </article>
    </section>

  </div>
</div>
