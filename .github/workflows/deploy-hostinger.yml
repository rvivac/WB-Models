# WB Agency - Pipeline de Deploy Hostinger (Angular 18 -> domains/wbagency.com.br/public_html via FTP)
# Deploy trigger: 2026-10-03T15:40:00
name: Deploy Frontend para Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Angular & Deploy FTP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Angular em Produção
        run: npm run build -- --configuration production

      - name: Garantir fallback SPA + CORS + Cache + Ignore (.htaccess / .git-ftp-ignore)
        run: |
          DIST_DIR="dist/frontend/browser"
          if [ ! -d "$DIST_DIR" ]; then
            echo "ERRO: $DIST_DIR não existe. Build falhou."
            exit 1
          fi
          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
          echo "--- Gerando .htaccess (.htaccess completo Hostinger) ---"
          cat > "$DIST_DIR/.htaccess" <<HTACCESS_EOF
DirectoryIndex index.html index.php
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /
  RewriteRule ^index\.html$ - [L]
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule . /index.html [L]
</IfModule>
HTACCESS_EOF
          echo "--- Gerando .git-ftp-ignore (não deleta assets grandes no servidor) ---"
          cat > "$DIST_DIR/.git-ftp-ignore" <<FTPIGNORE_EOF
# NUNCA apague os arquivos abaixo no servidor Hostinger
assets/videos/
assets/images/
assets/i18n/
*.mp4
*.jpg
*.jpeg
*.png
*.webp
*.avif
*.ico
*.svg
*.woff2
*.woff
sitemap.xml
robots.txt
*.php
FTPIGNORE_EOF
          ls -la "$DIST_DIR/.htaccess" "$DIST_DIR/.git-ftp-ignore"

      - name: Validar e Garantir Presença dos Assets no Pacote de Deploy
        run: |
          DIST_DIR="dist/frontend/browser"
          echo "=== Verificando integridade dos assets para deploy na Hostinger ==="
          if [ ! -d "$DIST_DIR/assets" ]; then
            echo "ERRO CRÍTICO: Pasta assets não encontrada em $DIST_DIR!"
            exit 1
          fi
          echo "Lista de arquivos e subdiretórios em assets:"
          ls -la "$DIST_DIR/assets"
          [ -d "$DIST_DIR/assets/i18n" ] && ls -la "$DIST_DIR/assets/i18n" || echo "(sem pasta i18n — usando translation service)"
          ls -la "$DIST_DIR/assets/images"
          ls -la "$DIST_DIR/assets/videos"
          echo "Tamanhos de arquivos críticos (em bytes):"
          du -cb "$DIST_DIR/assets/videos/"*  2>/dev/null | tail -1 || true
          du -b "$DIST_DIR/assets/images/hero-poster.jpg" 2>/dev/null || true
          echo "Assets validados com sucesso para o deploy."

      - name: Enviar arquivos via FTP para a Hostinger (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 600000
          local-dir: ./frontend/dist/frontend/browser/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'domains/wbagency.com.br/public_html/' }}

