# WB Agency - Pipeline de Deploy Hostinger (Angular 18 build -> public_html via FTP)
name: Deploy Frontend para Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Angular & Deploy FTP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Angular em Produção
        run: npm run build -- --configuration production

      - name: Garantir fallback SPA (404.html e .htaccess)
        run: |
          DIST_DIR="dist/frontend/browser"
          if [ ! -d "$DIST_DIR" ]; then
            echo "ERRO CRÍTICO: Build Angular NÃO GEROU $DIST_DIR!"
            exit 1
          fi
          # Fallback para rotas SPA caso servidor busque 404.html
          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"

          # Garante que o .htaccess completo de public/ esteja presente no diretório de build
          if [ ! -f "$DIST_DIR/.htaccess" ] && [ -f "public/.htaccess" ]; then
            cp "public/.htaccess" "$DIST_DIR/.htaccess"
          fi

          echo "--- Verificando .htaccess no pacote de build ---"
          ls -la "$DIST_DIR/.htaccess" && cat "$DIST_DIR/.htaccess"

      - name: Validar Integridade dos Arquivos de Build
        run: |
          DIST_DIR="dist/frontend/browser"
          echo "=== Verificando arquivos resultantes do build em $DIST_DIR ==="
          ls -la "$DIST_DIR"
          if [ ! -d "$DIST_DIR/assets" ]; then
            echo "ERRO CRÍTICO: Pasta assets não encontrada em $DIST_DIR!"
            exit 1
          fi
          echo "Tamanhos de arquivos críticos do build:"
          du -cb "$DIST_DIR/assets/videos/"* 2>/dev/null | tail -1 || true
          du -b "$DIST_DIR/assets/images/hero-poster.jpg" 2>/dev/null || true
          echo "Arquivos de build validados com sucesso para o deploy."

      - name: Instalar LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Enviar EXCLUSIVAMENTE arquivos do build para a Hostinger via LFTP
        run: |
          DIST_DIR="dist/frontend/browser"
          REMOTE_DIR="${{ secrets.FTP_SERVER_DIR || 'public_html/' }}"

          echo "=== 1. Validando pacote de build a ser transferido: $DIST_DIR ==="
          ls -la "$DIST_DIR"

          echo "=== 2. Conectando via FTP e espelhando exclusivamente os arquivos de build para $REMOTE_DIR ==="
          lftp -c "
            set net:timeout 30;
            set net:max-retries 3;
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            open -u \"${{ secrets.FTP_USERNAME }}\",\"${{ secrets.FTP_PASSWORD }}\" \"${{ secrets.FTP_SERVER }}\";
            mirror -Rev \
              --delete \
              --parallel=5 \
              \"$DIST_DIR/\" \"$REMOTE_DIR\";
            quit
          "
          echo "=== 3. Deploy dos arquivos de build finalizado com sucesso! ==="


