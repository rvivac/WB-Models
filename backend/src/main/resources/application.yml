server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:h2:mem:wblocaldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: WbLocalH2Pool
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 60000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20

app:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 28800000
    initial-admin:
      email: webmaster@wbagency.com.br
      password: Admin@WbScouting2026!
      name: Webmaster WB Agency (Local H2)
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:8080"

supabase:
  url: https://dummy-local.supabase.co
  key: local-dummy-key
  service-role-key: local-dummy-sr
  anon-key: local-dummy-anon
  storage:
    local-fallback: true
    local-dir: uploads-local

logging:
  level:
    com.wbscouting.api: DEBUG